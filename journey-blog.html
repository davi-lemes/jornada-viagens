<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Blog da Jornada</title>
  </head>
  <body>
    <header class="main-header">
      <a class="logo" href="index.html" title="voltar para a página inicial">
        <img
          class="img-mobile"
          src="img/Bussola-jornada-branca.png"
          alt="Bussola do logo Jornada Viagens na cor branca"
        />
        <img
          class="img-desktop"
          src="img/Bussola-texto-jornada-branco.png"
          alt="Logo Jornada Viagens na cor branca"
        />
      </a>
      <div class="navigation-menu">
        <label for="menu">
          <img src="img/menu.png" alt="menu" />
        </label>
        <input type="checkbox" id="menu" hidden />
        <!-- o atributo hidden serve para ocultar a caixinha de checkbox do input e mantem apenas a imagem que utilizamos na label -->
        <nav>
          <ul class="list-links">
            <li>
              <a
                href="journey-blog.html"
                title="Acessar Blog"
                aria-current="page"
                >Blog</a
              >
            </li>
            <li>
              <a href="travel-packages.html" title="Acessar Pacotes de Viagens"
                >Pacotes de viagem</a
              >
            </li>
            <li>
              <a href="contato.html" title="Acessar Contato">Contato</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
    <section class="hero journey-blog">
      <div class="hero-img">
        <div class="hero-content">
          <h1>Blog da Jornada</h1>
          <hr />
          <p>
            Histórias de viagens de nossos clientes. Inspire-se, encontre
            roteiros e dicas! Qual seu próximo destino?
          </p>
        </div>
      </div>
    </section>
  </body>
</html>
